---
layout: default
---

{% if page.hide_page_hero %}
<!-- Compact Page Header placeholder -->
<header class="masthead page-hero page-hero--compact" aria-hidden="true"></header>
{% else %}
<!-- Page Header -->
<header class="masthead page-hero">
  <div class="container">
    <div class="page-hero__inner">
      <div class="page-hero__content">
        <div class="page-heading">
          <h1 class="page-hero__title">{{ page.title }}</h1>
          {% if page.description %}
          <p class="page-hero__subtitle">{{ page.description }}</p>
          {% endif %}
        </div>
      </div>
      {% if page.background %}
      <div class="page-hero__media">
        <img src="{{ page.background | prepend: site.baseurl | replace: '//', '/' }}" alt="{{ page.title }} featured image" loading="lazy">
      </div>
      {% endif %}
    </div>
  </div>
</header>
{% endif %}

  <div class="container">
    <div class="row">
      <div class="col-lg-12 col-md-10 mx-auto">

        {{ content }}

      </div>
    </div>
  </div>
